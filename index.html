<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gamingpig | Aktuell Wartungsarbeiten</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100dvh;
    background: #030712;
    color: #f8fafc;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow-x: hidden;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: clamp(18px, 4vh, 36px) clamp(16px, 4vw, 28px);
    position: relative;
  }

  /* Fixed stage keeps ambient orbs, grid & particles from affecting mobile zoom/bounds */
  .bg-stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(circle at center, rgba(0,0,0,0.85) 20%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,0.85) 20%, transparent 80%);
    animation: gridPulse 8s ease-in-out infinite alternate;
  }
  @keyframes gridPulse {
    0% { opacity: 0.4; transform: scale(1); }
    100% { opacity: 0.75; transform: scale(1.03); }
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(75px);
    opacity: 0.44;
    will-change: transform;
  }
  .orb-1 {
    width: min(72vw, 380px); height: min(72vw, 380px);
    background: radial-gradient(circle, #38bdf8, #0284c7);
    top: -12%; left: -12%;
    animation: driftA 11s ease-in-out infinite alternate;
  }
  .orb-2 {
    width: min(76vw, 420px); height: min(76vw, 420px);
    background: radial-gradient(circle, #818cf8, #4f46e5);
    bottom: -14%; right: -12%;
    animation: driftB 13s ease-in-out infinite alternate;
  }
  .orb-3 {
    width: min(52vw, 260px); height: min(52vw, 260px);
    background: radial-gradient(circle, #ec4899, #9333ea);
    top: 48%; left: 50%;
    opacity: 0.2;
    animation: driftC 15s ease-in-out infinite alternate;
  }
  @keyframes driftA {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(8vw, 6vh, 0) scale(1.15); }
  }
  @keyframes driftB {
    0% { transform: translate3d(0, 0, 0) scale(1); }
    100% { transform: translate3d(-8vw, -6vh, 0) scale(1.12); }
  }
  @keyframes driftC {
    0% { transform: translate3d(-50%, -50%, 0) scale(0.95); }
    100% { transform: translate3d(-40%, -60%, 0) scale(1.2); }
  }

  /* Top animated equalizer & status strip */
  .top-strip {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #94a3b8;
    text-transform: uppercase;
  }
  .eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 14px;
  }
  .eq span {
    width: 3px;
    border-radius: 99px;
    background: linear-gradient(180deg, #38bdf8, #818cf8);
    animation: eqBar 1.1s ease-in-out infinite;
  }
  .eq span:nth-child(1) { height: 5px; animation-delay: 0s; }
  .eq span:nth-child(2) { height: 12px; animation-delay: 0.2s; }
  .eq span:nth-child(3) { height: 8px; animation-delay: 0.4s; }
  .eq span:nth-child(4) { height: 14px; animation-delay: 0.15s; }
  @keyframes eqBar {
    0%, 100% { transform: scaleY(0.45); opacity: 0.7; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  /* Main Liquid Glass Card */
  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    background: rgba(15, 23, 42, 0.74);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    padding: clamp(24px, 5vw, 34px) clamp(20px, 5vw, 28px);
    text-align: center;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    overflow: hidden;
    animation: cardRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: -40%;
    background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.06) 50%, transparent 60%);
    transform: translateX(-100%);
    animation: glassSheen 6.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassSheen {
    0%, 60% { transform: translateX(-100%); }
    100% { transform: translateX(120%); }
  }
  @keyframes cardRise {
    from { opacity: 0; transform: translate3d(0, 22px, 0) scale(0.96); }
    to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  .stagger {
    opacity: 0;
    animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .s1 { animation-delay: 0.08s; }
  .s2 { animation-delay: 0.16s; }
  .s3 { animation-delay: 0.24s; }
  .s4 { animation-delay: 0.32s; }
  .s5 { animation-delay: 0.40s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translate3d(0, 12px, 0); }
    to { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  .logo-wrap {
    width: 78px;
    height: 78px;
    margin: 0 auto 18px;
    border-radius: 22px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 36px rgba(56, 189, 248, 0.24);
    animation: logoFloat 4s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .logo-ring {
    position: absolute;
    inset: -7px;
    border-radius: 26px;
    border: 1.5px solid rgba(56, 189, 248, 0.32);
    animation: ringPulse 2.6s ease-out infinite;
    pointer-events: none;
  }
  @keyframes ringPulse {
    0% { transform: scale(0.96); opacity: 0.7; }
    100% { transform: scale(1.18); opacity: 0; }
  }
  .logo-wrap img { width: 50px; height: 50px; border-radius: 13px; }
  .gear-badge {
    position: absolute;
    bottom: -6px; right: -6px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #0f172a;
    border: 1px solid rgba(251, 191, 36, 0.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    animation: spinSlow 5s linear infinite;
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #fcd34d;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .pulse-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fbbf24;
    box-shadow: 0 0 10px #fbbf24;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.45); opacity: 0.45; }
  }

  h1 {
    font-size: clamp(23px, 5.5vw, 29px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ffffff 0%, #bae6fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: #cbd5e1;
    margin-bottom: 22px;
  }

  .progress-track {
    width: 100%;
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar {
    width: 48%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #ec4899, #38bdf8);
    background-size: 200% 100%;
    animation: slideBar 2s cubic-bezier(0.4, 0, 0.2, 1) infinite, glowFlow 3s linear infinite;
  }
  @keyframes slideBar {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(230%); }
  }
  @keyframes glowFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.15s, background 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-discord {
    background: #5865F2;
    color: #fff;
    box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
  }
  .btn-reload {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #e2e8f0;
    cursor: pointer;
  }

  /* Bottom animated wave & footer strip */
  .bottom-strip {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
  }
  .wave-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .wave-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #38bdf8;
    opacity: 0.35;
    animation: waveDot 1.6s ease-in-out infinite;
  }
  .wave-dots span:nth-child(2) { animation-delay: 0.2s; }
  .wave-dots span:nth-child(3) { animation-delay: 0.4s; }
  .wave-dots span:nth-child(4) { animation-delay: 0.6s; }
  .wave-dots span:nth-child(5) { animation-delay: 0.8s; }
  @keyframes waveDot {
    0%, 100% { transform: translateY(0); opacity: 0.3; }
    50% { transform: translateY(-5px); opacity: 0.95; }
  }
  .footer {
    font-size: 11.5px;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="bg-stage" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="top-strip">
    <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <span>Gamingpig · Systemstatus</span>
  </div>

  <main class="card">
    <div class="logo-wrap stagger s1">
      <div class="logo-ring"></div>
      <img src="icon-192.png" alt="Gamingpig">
      <div class="gear-badge">⚙️</div>
    </div>

    <div class="pill stagger s2">
      <span class="pulse-dot"></span>
      <span>Wartungsmodus aktiv</span>
    </div>

    <h1 class="stagger s3">Aktuell Wartungsarbeiten</h1>
    <p class="stagger s4">
      Diese Seite befindet sich aktuell in Wartungsarbeiten.
      Voraussichtlich dauert es etwas länger – vielen Dank für deine Geduld!
    </p>

    <div class="progress-track stagger s4">
      <div class="progress-bar"></div>
    </div>

    <div class="actions stagger s5">
      <a class="btn btn-discord" href="https://discord.gg/E8BS9BDAst" target="_blank" rel="noopener">💬 Discord Community</a>
      <button class="btn btn-reload" onclick="location.reload(true)">↻ Neu laden</button>
    </div>
  </main>

  <div class="bottom-strip">
    <div class="wave-dots" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="footer">© 2026 Gamingpig &amp; Team Gamingpig</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.update());
      }).catch(() => {});
    }
  </script>
</body>
</html>
