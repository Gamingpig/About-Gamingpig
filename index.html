<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamingpig | Aktuell Wartungsarbeiten</title>
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #030712;
    color: #f8fafc;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  /* Animated ambient orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.45;
    pointer-events: none;
    animation: floatOrb 10s ease-in-out infinite alternate;
  }
  .orb-1 {
    width: 340px; height: 340px;
    background: #0284c7;
    top: -90px; left: -90px;
  }
  .orb-2 {
    width: 380px; height: 380px;
    background: #6366f1;
    bottom: -110px; right: -90px;
    animation-delay: -5s;
  }
  @keyframes floatOrb {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(35px, -25px) scale(1.12); }
  }

  .card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 480px;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65);
    animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    border-radius: 20px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
  }
  .logo-wrap img {
    width: 48px;
    height: 48px;
    border-radius: 12px;
  }
  .gear-badge {
    position: absolute;
    bottom: -6px;
    right: -6px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #0f172a;
    border: 1px solid rgba(251, 191, 36, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    animation: spinSlow 6s linear infinite;
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #fcd34d;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fbbf24;
    box-shadow: 0 0 10px #fbbf24;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.5; }
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ffffff 0%, #bae6fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: #94a3b8;
    margin-bottom: 24px;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar {
    width: 45%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
    background-size: 200% 100%;
    animation: slideBar 1.8s ease-in-out infinite;
  }
  @keyframes slideBar {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(240%); }
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.15s, background 0.15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-discord {
    background: #5865F2;
    color: #fff;
  }
  .btn-reload {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #e2e8f0;
    cursor: pointer;
  }
  .footer {
    margin-top: 22px;
    font-size: 11.5px;
    color: #475569;
  }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="card">
    <div class="logo-wrap">
      <img src="icon-192.png" alt="Gamingpig">
      <div class="gear-badge">⚙️</div>
    </div>

    <div class="pill">
      <span class="pulse-dot"></span>
      <span>Update-Rollout läuft</span>
    </div>

    <h1>Aktuell Wartungsarbeiten</h1>
    <p>
      Wir schalten gerade das große Gamingpig-Update (<strong>v24.245.104</strong>) für euch live.
      In wenigen Minuten sind alle neuen Features wieder wie gewohnt erreichbar!
    </p>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <div class="actions">
      <a class="btn btn-discord" href="https://discord.gg/E8BS9BDAst" target="_blank" rel="noopener">💬 Discord Community</a>
      <button class="btn btn-reload" onclick="location.reload()">↻ Neu laden</button>
    </div>

    <div class="footer">© 2026 Gamingpig &amp; Team Gamingpig</div>
  </main>
</body>
</html>
