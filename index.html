<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gamingpig | Aktuell Wartungsarbeiten</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100dvh;
    background: radial-gradient(circle at top center, #0f172a 0%, #030712 72%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow-x: hidden;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 32px);
  }

  /* Central Maintenance Box — all animations live strictly inside here */
  .card {
    position: relative;
    width: 100%;
    max-width: 450px;
    background: rgba(15, 23, 42, 0.78);
    backdrop-filter: blur(26px);
    -webkit-backdrop-filter: blur(26px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 28px;
    padding: clamp(26px, 5vw, 36px) clamp(20px, 5vw, 28px);
    text-align: center;
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: -40%;
    background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.06) 50%, transparent 60%);
    transform: translateX(-100%);
    animation: glassSheen 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassSheen {
    0%, 55% { transform: translateX(-100%); }
    100% { transform: translateX(120%); }
  }

  /* Gamingpig Logo + Interlocking Rotating Gears */
  .logo-stage {
    width: 112px;
    height: 92px;
    margin: 0 auto 18px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-wrap {
    width: 74px;
    height: 74px;
    border-radius: 22px;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    box-shadow: 0 0 32px rgba(56, 189, 248, 0.24);
    animation: logoFloat 3.8s ease-in-out infinite;
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .logo-ring {
    position: absolute;
    inset: -7px;
    border-radius: 26px;
    border: 1.5px solid rgba(56, 189, 248, 0.32);
    animation: ringPulse 2.6s ease-out infinite;
    pointer-events: none;
  }
  @keyframes ringPulse {
    0% { transform: scale(0.96); opacity: 0.7; }
    100% { transform: scale(1.18); opacity: 0; }
  }
  .logo-wrap img {
    width: 48px;
    height: 48px;
    border-radius: 12px;
  }

  .gear {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #0f172a;
    border: 1px solid rgba(251, 191, 36, 0.55);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    z-index: 3;
  }
  .gear-main {
    width: 30px;
    height: 30px;
    bottom: 2px;
    right: 10px;
    font-size: 16px;
    animation: spinCW 4.5s linear infinite;
  }
  .gear-sub {
    width: 24px;
    height: 24px;
    top: 2px;
    left: 10px;
    font-size: 12px;
    border-color: rgba(56, 189, 248, 0.55);
    animation: spinCCW 3.5s linear infinite;
  }
  @keyframes spinCW {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spinCCW {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #fcd34d;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fbbf24;
    box-shadow: 0 0 10px #fbbf24;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.45); opacity: 0.45; }
  }

  h1 {
    font-size: clamp(23px, 5.5vw, 29px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #ffffff 0%, #bae6fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p {
    font-size: 14.5px;
    line-height: 1.6;
    color: #cbd5e1;
    margin-bottom: 22px;
  }

  .progress-track {
    width: 100%;
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-bar {
    width: 48%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
    background-size: 200% 100%;
    animation: slideBar 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  @keyframes slideBar {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(230%); }
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.15s, background 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-discord {
    background: #5865F2;
    color: #fff;
    box-shadow: 0 8px 24px rgba(88, 101, 242, 0.35);
  }
  .btn-reload {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: #e2e8f0;
    cursor: pointer;
  }
  .footer {
    margin-top: 20px;
    font-size: 11.5px;
    color: #64748b;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo-stage">
      <div class="gear gear-sub" aria-hidden="true">⚙️</div>
      <div class="logo-wrap">
        <div class="logo-ring" aria-hidden="true"></div>
        <img src="icon-192.png" alt="Gamingpig">
      </div>
      <div class="gear gear-main" aria-hidden="true">⚙️</div>
    </div>

    <div class="pill">
      <span class="pulse-dot"></span>
      <span>Wartungsmodus aktiv</span>
    </div>

    <h1>Aktuell Wartungsarbeiten</h1>
    <p>
      Diese Seite befindet sich aktuell in Wartungsarbeiten.
      Voraussichtlich dauert es etwas länger – vielen Dank für deine Geduld!
    </p>

    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>

    <div class="actions">
      <a class="btn btn-discord" href="https://discord.gg/E8BS9BDAst" target="_blank" rel="noopener">💬 Discord Community</a>
      <button class="btn btn-reload" onclick="location.reload(true)">↻ Neu laden</button>
    </div>

    <div class="footer">© 2026 Gamingpig &amp; Team Gamingpig</div>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => reg.update());
      }).catch(() => {});
    }
  </script>
</body>
</html>
