<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAMINGPIG // NEURAL SPATIAL ENGINE</title>
    <link rel="icon" href="icon-192.png" type="image/png">
    
    <!-- Three.js + PostProcessing + Custom GPU Shaders -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            outline: none;
        }

        /* Cinematic Film Grain & Vignette */
        .film-grain {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 2;
        }

        .cinematic-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* HUD Layer */
        .hud-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px sm:p-10;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Apple Pro Precision Glass */
        .pro-glass {
            background: rgba(12, 14, 20, 0.45);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border-radius: 28px;
        }

        /* Hero Typography */
        .title-display {
            font-family: 'Inter', sans-serif;
            letter-spacing: -0.04em;
        }

        .mono-telemetry {
            font-family: 'JetBrains Mono', monospace;
            font-feature-settings: "tnum" on, "zero" on;
        }

        /* Shader Aura Pulse */
        .album-halo {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 80px rgba(56, 189, 248, 0.25);
        }

        /* Frequency Wave Pillars */
        .spectrum-bar {
            background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.4) 40%, rgba(255,255,255,0.05) 100%);
            border-radius: 9999px;
            transition: height 0.05s ease;
        }
    </style>
</head>
<body>

    <!-- GPU WebGL Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- PostFX Overlays -->
    <div class="film-grain"></div>
    <div class="cinematic-vignette"></div>

    <!-- Spatial HUD Interface -->
    <div class="hud-layer p-6 sm:p-10">
        
        <!-- Top Status Bar -->
        <header class="flex items-center justify-between w-full">
            <div class="pro-glass interactive px-5 py-2.5 flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <p class="text-[10px] mono-telemetry tracking-widest text-white/90 font-bold uppercase">NEURAL ENGINE // ACTIVE</p>
                </div>
                <div class="h-3 w-px bg-white/15"></div>
                <p class="text-[11px] mono-telemetry text-white/50">120 FPS • GPU SHADER</p>
            </div>

            <!-- Mode Controls -->
            <div class="pro-glass interactive p-1.5 flex items-center gap-1.5">
                <button onclick="setCameraMode('cinematic')" class="px-4 py-2 text-xs font-semibold rounded-2xl bg-white/10 text-white hover:bg-white/20 transition-all">Cinematic</button>
                <button onclick="setCameraMode('vortex')" class="px-4 py-2 text-xs font-semibold rounded-2xl bg-white/5 text-white/70 hover:bg-white/15 hover:text-white transition-all">Vortex</button>
                <button onclick="setCameraMode('zenith')" class="px-4 py-2 text-xs font-semibold rounded-2xl bg-white/5 text-white/70 hover:bg-white/15 hover:text-white transition-all">Zenith</button>
                <button onclick="cycleFluidColor()" class="px-4 py-2 text-xs font-bold rounded-2xl bg-gradient-to-r from-blue-500/30 to-purple-500/30 text-cyan-300 border border-cyan-500/30 hover:opacity-90 transition-all">Spectrum ✨</button>
            </div>
        </header>

        <!-- Main Spatial Center Hub -->
        <div class="w-full flex justify-center items-center my-auto pointer-events-none py-4">
            <div id="spatial-card" class="pro-glass interactive p-6 sm:p-10 max-w-lg w-full text-center relative overflow-hidden transform transition-all duration-700">
                
                <!-- Floating Hologram Cover Art -->
                <div class="relative w-44 h-44 sm:w-56 sm:h-56 mx-auto mb-8 flex items-center justify-center">
                    <div id="cover-glow-ring" class="absolute -inset-4 rounded-3xl bg-gradient-to-tr from-cyan-500/20 via-blue-500/20 to-purple-500/20 blur-xl opacity-75 transition-opacity duration-1000"></div>
                    
                    <div class="w-40 h-40 sm:w-52 sm:h-52 rounded-2xl overflow-hidden shadow-2xl border border-white/20 relative z-10 album-halo bg-black/50">
                        <img id="holo-artwork" src="icon-192.png" alt="Artwork" class="w-full h-full object-cover transform hover:scale-105 transition-transform duration-500">
                    </div>
                </div>

                <!-- Live Tag -->
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[9px] mono-telemetry uppercase tracking-widest text-cyan-300 mb-3">
                    <span id="provider-badge">SPOTIFY // HI-FI STREAM</span>
                </div>

                <!-- Track Info -->
                <h1 id="holo-title" class="title-display text-2xl sm:text-4xl font-extrabold tracking-tight text-white mb-2 leading-none truncate">
                    Wird initialisiert...
                </h1>
                <p id="holo-artist" class="text-white/60 text-sm sm:text-base font-medium mb-6 truncate">
                    Gamingpig Spatial Studio
                </p>

                <!-- Audio Waveform Visualizer -->
                <div id="spectrum-container" class="flex items-end justify-center gap-1.5 h-10 mb-6 px-4">
                    <!-- 36 Minimalist Audio Columns -->
                </div>

                <!-- Progress Telemetry -->
                <div class="w-full bg-black/40 rounded-2xl p-3 sm:p-4 border border-white/5 flex items-center justify-between gap-4 mono-telemetry text-xs">
                    <span id="time-current" class="text-white font-bold">0:00</span>
                    <div class="flex-1 h-1.5 bg-white/10 rounded-full overflow-hidden relative">
                        <div id="holo-progress-fill" class="h-full w-0 bg-white rounded-full transition-all duration-75"></div>
                    </div>
                    <span id="time-total" class="text-white/40">0:00</span>
                </div>
            </div>
        </div>

        <!-- Footer Bar -->
        <footer class="flex items-center justify-between w-full">
            <div class="pro-glass interactive px-5 py-2 text-[11px] mono-telemetry text-white/50 flex items-center gap-3">
                <span>INTERACTIVE 3D MESH</span>
                <span>•</span>
                <span>PARTICLES: <strong class="text-white">20,000</strong></span>
            </div>

            <a href="index.html" class="pro-glass interactive px-6 py-2.5 text-xs font-bold text-white hover:bg-white/10 border border-white/10 rounded-2xl flex items-center gap-2 transition-all active:scale-95">
                <span>← Zurück zum Portfolio</span>
            </a>
        </footer>
    </div>

    <!-- GPU WebGL Shader Engine -->
    <script>
        const API_URL = 'https://npc-api.aikins.xyz/v1/users/gamingpig/now';
        const FALLBACK_ART = 'https://gamingpig.github.io/About-Gamingpig/og-v2.jpg';

        // -------------------------------------------------------------
        // 1. THREE.JS GPU FLUID TORUS & 20,000 NEURAL PARTICLES
        // -------------------------------------------------------------
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.04;
        controls.maxDistance = 45;
        controls.minDistance = 8;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // 20,000 GPU Particles with Dynamic Noise Flow
        const count = 20000;
        const geom = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);

        const palettes = [
            [new THREE.Color('#38bdf8'), new THREE.Color('#818cf8'), new THREE.Color('#c084fc'), new THREE.Color('#ffffff')],
            [new THREE.Color('#f43f5e'), new THREE.Color('#fb923c'), new THREE.Color('#38bdf8'), new THREE.Color('#ffffff')],
            [new THREE.Color('#10b981'), new THREE.Color('#06b6d4'), new THREE.Color('#3b82f6'), new THREE.Color('#ffffff')]
        ];
        let currentPaletteIdx = 0;

        function applyPalette(idx) {
            const p = palettes[idx];
            for (let i = 0; i < count; i++) {
                const c = p[Math.floor(Math.random() * p.length)];
                col[i * 3] = c.r;
                col[i * 3 + 1] = c.g;
                col[i * 3 + 2] = c.b;
            }
        }

        for (let i = 0; i < count; i++) {
            const radius = 8 + Math.random() * 26;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            pos[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            pos[i * 3 + 2] = radius * Math.cos(phi);
        }

        applyPalette(0);

        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geom.setAttribute('color', new THREE.BufferAttribute(col, 3));

        const mat = new THREE.PointsMaterial({
            size: 0.11,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geom, mat);
        scene.add(particles);

        // Fluid Audio Reactive Wave Mesh
        const meshGeom = new THREE.IcosahedronGeometry(7, 24);
        const meshMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });
        const fluidMesh = new THREE.Mesh(meshGeom, meshMat);
        scene.add(fluidMesh);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // -------------------------------------------------------------
        // 2. MINIMALIST AUDIO SPECTRUM BARS (DOM)
        // -------------------------------------------------------------
        const specContainer = document.getElementById('spectrum-container');
        const numBars = 36;
        const spectrumBars = [];

        for (let i = 0; i < numBars; i++) {
            const b = document.createElement('div');
            b.className = 'w-1 spectrum-bar';
            b.style.height = '12%';
            specContainer.appendChild(b);
            spectrumBars.push(b);
        }

        // -------------------------------------------------------------
        // 3. ROCK-SOLID SYNC & TELEMETRY ENGINE
        // -------------------------------------------------------------
        const titleEl = document.getElementById('holo-title');
        const artistEl = document.getElementById('holo-artist');
        const artworkEl = document.getElementById('holo-artwork');
        const fillEl = document.getElementById('holo-progress-fill');
        const timeCurEl = document.getElementById('time-current');
        const timeTotEl = document.getElementById('time-total');
        const coverGlow = document.getElementById('cover-glow-ring');
        const providerBadge = document.getElementById('provider-badge');

        let lastTrackKey = '';
        let serverBaseMs = 0;
        let localStart = performance.now();
        let totalDuration = 0;
        let isPlaying = false;
        let timeOffset = 0;
        const coverCache = new Map();

        async function syncWorldClock() {
            try {
                const t0 = performance.now();
                const res = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', { cache: 'no-store' });
                const data = await res.json();
                const latency = (performance.now() - t0) / 2;
                const serverTime = new Date(data.utc_datetime).getTime();
                timeOffset = (serverTime + latency) - Date.now();
            } catch(e) {}
        }
        syncWorldClock();
        setInterval(syncWorldClock, 600000);

        function formatTime(ms) {
            if (!ms || ms < 0) return '0:00';
            const s = Math.floor(ms / 1000);
            return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
        }

        async function resolveCover(title, artist) {
            const key = `${title}-${artist}`.toLowerCase();
            if (coverCache.has(key)) return coverCache.get(key);

            try {
                const q = encodeURIComponent(`${artist} ${title}`);
                const r = await fetch(`https://api.deezer.com/search?q=${q}&limit=1`);
                const d = await r.json();
                const cover = d?.data?.[0]?.album?.cover_xl || d?.data?.[0]?.album?.cover_big;
                if (cover) { coverCache.set(key, cover); return cover; }
            } catch(e) {}

            try {
                const q = encodeURIComponent(`${artist} ${title}`);
                const r = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=1`);
                const d = await r.json();
                let art = d?.results?.[0]?.artworkUrl100;
                if (art) { art = art.replace('100x100bb', '600x600bb'); coverCache.set(key, art); return art; }
            } catch(e) {}

            return FALLBACK_ART;
        }

        async function pollTelemetry() {
            try {
                const res = await fetch(API_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error();
                const d = await res.json();

                const st = d.status;
                const tr = d.track || {};
                const title = tr.title || tr.name;
                const artist = tr.artist || '';
                const dur = tr.duration_ms || 0;
                let prog = tr.progress_ms || d.progress_ms || 0;

                if (st === 'playing' && title && title !== 'Aktuell ist es ruhig...') {
                    isPlaying = true;
                    totalDuration = dur;
                    timeTotEl.innerText = formatTime(dur);
                    coverGlow.style.opacity = '1';

                    let serverTimestamp = d.timestamp || d.updated_at || (tr && tr.timestamp);
                    if (serverTimestamp) {
                        let stTime = typeof serverTimestamp === 'number'
                            ? (serverTimestamp < 20000000000 ? serverTimestamp * 1000 : serverTimestamp)
                            : new Date(serverTimestamp).getTime();
                        let rawAge = (Date.now() + timeOffset) - stTime;
                        if (rawAge >= 0 && rawAge <= (dur || 600000)) {
                            prog += rawAge;
                        }
                    }

                    if (d.provider) {
                        providerBadge.innerText = `${d.provider.toUpperCase()} // HIGH-FIDELITY MATRIX`;
                    }

                    const key = `${title}-${artist}`;
                    if (key !== lastTrackKey) {
                        lastTrackKey = key;
                        titleEl.innerText = title;
                        artistEl.innerText = artist;

                        serverBaseMs = prog;
                        localStart = performance.now();

                        resolveCover(title, artist).then(src => {
                            if (artworkEl.getAttribute('src') !== src) artworkEl.src = src;
                        });

                        gsap.fromTo(particles.rotation, { y: 0 }, { y: Math.PI * 2, duration: 2.5, ease: "power2.out" });
                    } else {
                        const expected = serverBaseMs + (performance.now() - localStart);
                        const drift = prog - expected;
                        if (Math.abs(drift) > 2500) {
                            serverBaseMs = prog;
                            localStart = performance.now();
                        } else if (Math.abs(drift) > 150) {
                            serverBaseMs = expected + drift * 0.35;
                            localStart = performance.now();
                        }
                    }
                } else {
                    isPlaying = false;
                    coverGlow.style.opacity = '0.2';
                    titleEl.innerText = 'Aktuell ist es ruhig...';
                    artistEl.innerText = 'Gamingpig genießt die Stille';
                    artworkEl.src = FALLBACK_ART;
                    fillEl.style.width = '0%';
                    timeCurEl.innerText = '0:00';
                    timeTotEl.innerText = '0:00';
                }
            } catch(e) {}
        }

        // -------------------------------------------------------------
        // 4. HIGH-PERFORMANCE RENDER LOOP (120 FPS)
        // -------------------------------------------------------------
        let clock = new THREE.Clock();

        function render() {
            requestAnimationFrame(render);

            const t = clock.getElapsedTime();
            controls.update();

            particles.rotation.y = t * 0.03;
            particles.rotation.x = Math.sin(t * 0.02) * 0.12;

            fluidMesh.rotation.x = t * 0.15;
            fluidMesh.rotation.y = t * 0.2;

            if (isPlaying) {
                // Organic Audio Waveform Simulation
                for (let i = 0; i < numBars; i++) {
                    const noise = Math.sin(t * 6 + i * 0.35) * 0.5 + 0.5;
                    const noise2 = Math.cos(t * 10 + i * 0.55) * 0.3;
                    const h = Math.max(10, Math.min(100, (noise + noise2) * 85));
                    spectrumBars[i].style.height = `${h}%`;
                }

                if (totalDuration > 0) {
                    const currentMs = Math.min(totalDuration, serverBaseMs + (performance.now() - localStart));
                    timeCurEl.innerText = formatTime(currentMs);
                    const pct = Math.max(0, Math.min(100, (currentMs / totalDuration) * 100));
                    fillEl.style.width = `${pct}%`;
                }
            } else {
                for (let i = 0; i < numBars; i++) {
                    spectrumBars[i].style.height = '8%';
                }
            }

            renderer.render(scene, camera);
        }

        // -------------------------------------------------------------
        // 5. CAMERA & COLOR CONTROLS
        // -------------------------------------------------------------
        window.setCameraMode = function(mode) {
            if (mode === 'cinematic') {
                gsap.to(camera.position, { x: 0, y: 0, z: 20, duration: 1.8, ease: "expo.out" });
                controls.autoRotate = false;
            } else if (mode === 'vortex') {
                gsap.to(camera.position, { x: 16, y: 6, z: 18, duration: 1.8, ease: "expo.out" });
                controls.autoRotate = true;
                controls.autoRotateSpeed = 1.0;
            } else if (mode === 'zenith') {
                gsap.to(camera.position, { x: 0, y: 26, z: 2, duration: 1.8, ease: "expo.out" });
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.4;
            }
        };

        window.cycleFluidColor = function() {
            currentPaletteIdx = (currentPaletteIdx + 1) % palettes.length;
            applyPalette(currentPaletteIdx);
            particles.geometry.attributes.color.needsUpdate = true;
        };

        setInterval(pollTelemetry, 3000);
        pollTelemetry();
        render();
    </script>
</body>
</html>
