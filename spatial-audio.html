<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAMINGPIG // CYBERPUNK 3D AUDIO SPATIAL STUDIO</title>
    <link rel="icon" href="icon-192.png" type="image/png">
    
    <!-- Three.js + Postprocessing + GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #02040a;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #webgl-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            outline: none;
        }

        /* Sci-Fi Atmospheric Vignette & Grid */
        .cyber-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(2, 4, 10, 0.7) 70%, #02040a 100%);
            pointer-events: none;
            z-index: 2;
        }

        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.7;
        }

        /* Glassmorphism Next-Gen HUD */
        .hud-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px sm:p-8;
        }

        .interactive {
            pointer-events: auto;
        }

        .studio-card {
            background: rgba(8, 14, 28, 0.75);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(59, 130, 246, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-radius: 36px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .studio-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 35px 90px rgba(0, 0, 0, 0.9), 0 0 50px rgba(59, 130, 246, 0.25);
        }

        /* Vinyl 3D Ring Glow */
        .vinyl-glow {
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.45), 0 0 100px rgba(236, 72, 153, 0.25);
        }

        .spinning-disc {
            animation: spinDisc 16s linear infinite;
        }

        .spinning-disc.paused {
            animation-play-state: paused;
        }

        @keyframes spinDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Pulsing Audio Equalizer Bars */
        .eq-column {
            background: linear-gradient(180deg, #38bdf8, #818cf8, #f43f5e);
            border-radius: 4px;
            transition: height 0.06s ease;
        }
    </style>
</head>
<body>

    <!-- 3D WebGL Canvas Layer -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Visual Overlays -->
    <div class="cyber-vignette"></div>
    <div class="cyber-grid"></div>

    <!-- Main Spatial HUD Overlay -->
    <div class="hud-layer p-4 sm:p-8">
        
        <!-- Top Bar: Status, Telemetry & Viewport Controls -->
        <header class="flex items-center justify-between w-full flex-wrap gap-3">
            <div class="studio-card interactive px-4 sm:px-6 py-3 flex items-center gap-4">
                <div class="relative flex items-center justify-center">
                    <span id="live-indicator-ping" class="w-3 h-3 rounded-full bg-emerald-400 animate-ping absolute opacity-75"></span>
                    <span id="live-indicator-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 relative"></span>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <p class="text-[10px] font-mono tracking-widest text-emerald-400 font-bold uppercase" id="telemetry-status">SPATIAL STUDIO // LIVE</p>
                        <span class="text-[9px] px-1.5 py-0.5 bg-blue-500/20 text-blue-400 rounded-md border border-blue-500/30 font-mono font-black">60 FPS SYNC</span>
                    </div>
                    <p class="text-xs font-bold text-slate-300">Gamingpig • Audio Matrix</p>
                </div>
            </div>

            <!-- Visualizer Cameras & Color Themes -->
            <div class="studio-card interactive p-1.5 flex items-center gap-1.5 flex-wrap">
                <button onclick="setCameraView('center')" class="px-3 sm:px-4 py-2 text-xs font-black rounded-2xl bg-blue-600/30 text-blue-400 border border-blue-500/40 hover:bg-blue-600/50 transition-all">🎯 Studio Focus</button>
                <button onclick="setCameraView('orbit')" class="px-3 sm:px-4 py-2 text-xs font-black rounded-2xl bg-white/5 text-slate-300 hover:bg-white/10 transition-all">🪐 Cinematic Orbit</button>
                <button onclick="setCameraView('top')" class="px-3 sm:px-4 py-2 text-xs font-black rounded-2xl bg-white/5 text-slate-300 hover:bg-white/10 transition-all">🌌 Galaxy View</button>
                <button onclick="switchVisualizerColor()" class="px-3 sm:px-4 py-2 text-xs font-black rounded-2xl bg-gradient-to-r from-pink-500/20 to-purple-500/20 text-pink-400 border border-pink-500/30 hover:opacity-90 transition-all">✨ Cyber Neon</button>
            </div>
        </header>

        <!-- Center Floating Holographic Card (Desktop & Mobile) -->
        <div class="w-full flex justify-center items-center my-auto pointer-events-none py-6">
            <div id="spatial-card" class="studio-card interactive p-6 sm:p-10 max-w-xl w-full text-center relative overflow-hidden">
                
                <!-- 3D Vinyl Center Piece -->
                <div class="relative w-40 h-40 sm:w-52 sm:h-52 mx-auto mb-6 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full border-2 border-blue-500/40 animate-pulse"></div>
                    <div class="absolute -inset-3 rounded-full border border-purple-500/30 vinyl-glow"></div>
                    
                    <!-- Spinning Disc with Vinyl Grooves -->
                    <div id="vinyl-disc" class="w-36 h-36 sm:w-48 sm:h-48 rounded-full overflow-hidden shadow-2xl border-4 border-slate-900/80 relative z-10 spinning-disc bg-black flex items-center justify-center">
                        <img id="holo-artwork" src="icon-192.png" alt="Cover" class="w-full h-full object-cover rounded-full">
                        <!-- Vinyl Center Spindle -->
                        <div class="absolute w-7 h-7 sm:w-9 sm:h-9 bg-slate-900 rounded-full border-2 border-white/40 shadow-inner flex items-center justify-center">
                            <div class="w-2.5 h-2.5 bg-black rounded-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Provider Badge -->
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-[10px] font-mono uppercase tracking-widest text-cyan-400 mb-3 font-bold">
                    <span id="provider-badge">SPOTIFY // LOSSLESS SPATIAL</span>
                </div>

                <!-- Song Title & Artist -->
                <h1 id="holo-title" class="text-2xl sm:text-4xl font-black tracking-tight text-white mb-2 leading-tight drop-shadow-md truncate">
                    Wird geladen...
                </h1>
                <p id="holo-artist" class="text-slate-400 text-sm sm:text-base font-bold mb-6 truncate">
                    Gamingpig Spatial Studio
                </p>

                <!-- Audio Equalizer Spectrum -->
                <div id="wave-bars-container" class="flex items-end justify-center gap-1.5 h-12 mb-6 px-2">
                    <!-- 32 Dynamic Spectrum Columns -->
                </div>

                <!-- Live Progress HUD -->
                <div class="w-full bg-slate-950/80 rounded-2xl p-3 sm:p-4 border border-slate-800 flex items-center justify-between gap-4 font-mono text-xs shadow-inner">
                    <span id="time-current" class="text-cyan-400 font-black">0:00</span>
                    <div class="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden relative">
                        <div id="holo-progress-fill" class="h-full w-0 bg-gradient-to-r from-cyan-400 via-indigo-500 to-pink-500 rounded-full transition-all duration-75"></div>
                    </div>
                    <span id="time-total" class="text-slate-400 font-bold">0:00</span>
                </div>
            </div>
        </div>

        <!-- Bottom Footer Controls -->
        <footer class="flex items-center justify-between w-full flex-wrap gap-3">
            <div class="studio-card interactive px-4 py-2 text-[11px] font-mono text-slate-400 flex items-center gap-3">
                <span>🛰️ DRAG 3D: <strong class="text-white">Active</strong></span>
                <span>•</span>
                <span>PARTICLES: <strong class="text-cyan-400">14,000</strong></span>
            </div>

            <a href="index.html" class="studio-card interactive px-6 py-3 text-xs font-black text-white bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/40 rounded-2xl flex items-center gap-2 transition-all shadow-lg active:scale-95">
                <span>← Zurück zum Haupt-Portfolio</span>
            </a>
        </footer>
    </div>

    <!-- 3D Three.js & Precision Timing Engine -->
    <script>
        const API_URL = 'https://npc-api.aikins.xyz/v1/users/gamingpig/now';
        const FALLBACK_ART = 'https://gamingpig.github.io/About-Gamingpig/og-v2.jpg';

        // -------------------------------------------------------------
        // 1. THREE.JS SPATIAL 3D UNIVERSE (14,000 NEBULA PARTICLES)
        // -------------------------------------------------------------
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02040a, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 19);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 50;
        controls.minDistance = 8;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;

        // 14,000 Dynamic Star & Nebula Particles
        const particleCount = 14000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        let colorThemes = [
            [new THREE.Color('#38bdf8'), new THREE.Color('#818cf8'), new THREE.Color('#f43f5e'), new THREE.Color('#3b82f6')],
            [new THREE.Color('#ec4899'), new THREE.Color('#8b5cf6'), new THREE.Color('#06b6d4'), new THREE.Color('#10b981')],
            [new THREE.Color('#f59e0b'), new THREE.Color('#ef4444'), new THREE.Color('#8b5cf6'), new THREE.Color('#00f2fe')]
        ];
        let currentThemeIndex = 0;

        function populateParticleColors(themeIdx) {
            const activePalette = colorThemes[themeIdx];
            for (let i = 0; i < particleCount; i++) {
                const col = activePalette[Math.floor(Math.random() * activePalette.length)];
                colors[i * 3] = col.r;
                colors[i * 3 + 1] = col.g;
                colors[i * 3 + 2] = col.b;
            }
        }

        for (let i = 0; i < particleCount; i++) {
            const radius = 10 + Math.random() * 28;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = radius * Math.cos(phi);
        }

        populateParticleColors(0);

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.14,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Holographic Gyro Ring
        const ringGeom = new THREE.TorusGeometry(9, 0.06, 16, 120);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.25 });
        const ringMesh = new THREE.Mesh(ringGeom, ringMat);
        scene.add(ringMesh);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // -------------------------------------------------------------
        // 2. EQUALIZER SPECTRUM BARS (DOM)
        // -------------------------------------------------------------
        const waveContainer = document.getElementById('wave-bars-container');
        const totalBars = 32;
        const bars = [];

        for (let i = 0; i < totalBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'w-1 sm:w-1.5 eq-column';
            bar.style.height = '15%';
            waveContainer.appendChild(bar);
            bars.push(bar);
        }

        // -------------------------------------------------------------
        // 3. ROCK-SOLID TIME-SYNC & PROGRESS ENGINE (NO GLITCH)
        // -------------------------------------------------------------
        const titleEl = document.getElementById('holo-title');
        const artistEl = document.getElementById('holo-artist');
        const artworkEl = document.getElementById('holo-artwork');
        const fillEl = document.getElementById('holo-progress-fill');
        const timeCurEl = document.getElementById('time-current');
        const timeTotEl = document.getElementById('time-total');
        const vinylDisc = document.getElementById('vinyl-disc');
        const providerBadge = document.getElementById('provider-badge');

        let lastTrackKey = '';
        let serverBaseMs = 0;
        let localStart = performance.now();
        let totalDuration = 0;
        let isPlaying = false;
        let timeOffset = 0;
        const cache = new Map();

        // Präzise Weltzeitmessung gegen Latenz
        async function syncWorldClock() {
            try {
                const t0 = performance.now();
                const res = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', { cache: 'no-store' });
                const data = await res.json();
                const latency = (performance.now() - t0) / 2;
                const serverTime = new Date(data.utc_datetime).getTime();
                timeOffset = (serverTime + latency) - Date.now();
            } catch(e) {}
        }
        syncWorldClock();
        setInterval(syncWorldClock, 600000);

        function formatTime(ms) {
            if (!ms || ms < 0) return '0:00';
            const s = Math.floor(ms / 1000);
            return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
        }

        async function resolveCover(title, artist) {
            const key = `${title}-${artist}`.toLowerCase();
            if (cache.has(key)) return cache.get(key);

            try {
                const q = encodeURIComponent(`${artist} ${title}`);
                const r = await fetch(`https://api.deezer.com/search?q=${q}&limit=1`);
                const d = await r.json();
                const cover = d?.data?.[0]?.album?.cover_xl || d?.data?.[0]?.album?.cover_big;
                if (cover) { cache.set(key, cover); return cover; }
            } catch(e) {}

            try {
                const q = encodeURIComponent(`${artist} ${title}`);
                const r = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=1`);
                const d = await r.json();
                let art = d?.results?.[0]?.artworkUrl100;
                if (art) { art = art.replace('100x100bb', '600x600bb'); cache.set(key, art); return art; }
            } catch(e) {}

            return FALLBACK_ART;
        }

        async function pollTelemetry() {
            try {
                const res = await fetch(API_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error();
                const d = await res.json();

                const st = d.status;
                const tr = d.track || {};
                const title = tr.title || tr.name;
                const artist = tr.artist || '';
                const dur = tr.duration_ms || 0;
                let prog = tr.progress_ms || d.progress_ms || 0;

                if (st === 'playing' && title && title !== 'Aktuell ist es ruhig...') {
                    isPlaying = true;
                    totalDuration = dur;
                    timeTotEl.innerText = formatTime(dur);
                    vinylDisc.classList.remove('paused');

                    // Alter der Serverantwort herausrechnen
                    let serverTimestamp = d.timestamp || d.updated_at || (tr && tr.timestamp);
                    if (serverTimestamp) {
                        let stTime = typeof serverTimestamp === 'number'
                            ? (serverTimestamp < 20000000000 ? serverTimestamp * 1000 : serverTimestamp)
                            : new Date(serverTimestamp).getTime();
                        let rawAge = (Date.now() + timeOffset) - stTime;
                        if (rawAge >= 0 && rawAge <= (dur || 600000)) {
                            prog += rawAge;
                        }
                    }

                    if (d.provider) {
                        providerBadge.innerText = `${d.provider.toUpperCase()} // SPATIAL MATRIX`;
                    }

                    const key = `${title}-${artist}`;
                    if (key !== lastTrackKey) {
                        lastTrackKey = key;
                        titleEl.innerText = title;
                        artistEl.innerText = artist;

                        serverBaseMs = prog;
                        localStart = performance.now();

                        resolveCover(title, artist).then(src => {
                            if (artworkEl.src !== src) artworkEl.src = src;
                        });

                        gsap.fromTo(particleSystem.rotation, { y: 0 }, { y: Math.PI * 2, duration: 2, ease: "power2.out" });
                    } else {
                        // Weicher Drift-Ausgleich gegen Springen
                        const expected = serverBaseMs + (performance.now() - localStart);
                        const drift = prog - expected;
                        if (Math.abs(drift) > 2500) {
                            serverBaseMs = prog;
                            localStart = performance.now();
                        } else if (Math.abs(drift) > 150) {
                            serverBaseMs = expected + drift * 0.35;
                            localStart = performance.now();
                        }
                    }
                } else {
                    isPlaying = false;
                    vinylDisc.classList.add('paused');
                    titleEl.innerText = 'Aktuell ist es ruhig...';
                    artistEl.innerText = 'Gamingpig genießt die Stille';
                    artworkEl.src = FALLBACK_ART;
                    fillEl.style.width = '0%';
                    timeCurEl.innerText = '0:00';
                    timeTotEl.innerText = '0:00';
                }
            } catch(e) {}
        }

        // -------------------------------------------------------------
        // 4. ANIMATION LOOP (60-120 FPS FLÜSSIG)
        // -------------------------------------------------------------
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            controls.update();

            particleSystem.rotation.y = elapsedTime * 0.04;
            particleSystem.rotation.x = Math.sin(elapsedTime * 0.02) * 0.15;
            ringMesh.rotation.x = elapsedTime * 0.15;
            ringMesh.rotation.y = elapsedTime * 0.25;

            // Audio Waveform Spectrum
            if (isPlaying) {
                for (let i = 0; i < totalBars; i++) {
                    const noise1 = Math.sin(elapsedTime * 7 + i * 0.4) * 0.5 + 0.5;
                    const noise2 = Math.cos(elapsedTime * 11 + i * 0.6) * 0.3;
                    const heightPercent = Math.max(10, Math.min(100, (noise1 + noise2) * 85));
                    bars[i].style.height = `${heightPercent}%`;
                }

                if (totalDuration > 0) {
                    const currentMs = Math.min(totalDuration, serverBaseMs + (performance.now() - localStart));
                    timeCurEl.innerText = formatTime(currentMs);
                    const pct = Math.max(0, Math.min(100, (currentMs / totalDuration) * 100));
                    fillEl.style.width = `${pct}%`;
                }
            } else {
                for (let i = 0; i < totalBars; i++) {
                    bars[i].style.height = '10%';
                }
            }

            renderer.render(scene, camera);
        }

        // -------------------------------------------------------------
        // 5. CAMERA CONTROLS & THEME SWITCHER
        // -------------------------------------------------------------
        window.setCameraView = function(view) {
            if (view === 'center') {
                gsap.to(camera.position, { x: 0, y: 0, z: 19, duration: 1.5, ease: "power3.inOut" });
                controls.autoRotate = false;
            } else if (view === 'orbit') {
                gsap.to(camera.position, { x: 15, y: 7, z: 18, duration: 1.5, ease: "power3.inOut" });
                controls.autoRotate = true;
                controls.autoRotateSpeed = 1.0;
            } else if (view === 'top') {
                gsap.to(camera.position, { x: 0, y: 26, z: 2, duration: 1.5, ease: "power3.inOut" });
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.4;
            }
        };

        window.switchVisualizerColor = function() {
            currentThemeIndex = (currentThemeIndex + 1) % colorThemes.length;
            populateParticleColors(currentThemeIndex);
            particleSystem.geometry.attributes.color.needsUpdate = true;
        };

        setInterval(pollTelemetry, 3000);
        pollTelemetry();
        animate();
    </script>
</body>
</html>
