<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAMINGPIG // STUDIO EXPERIENCE</title>
    <link rel="icon" href="icon-192.png" type="image/png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fluid Aurora Mesh Background */
        .aurora-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            background: #020617;
        }

        .aurora-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: floatOrb 20s infinite alternate ease-in-out;
            transition: background-color 1.5s ease;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: #3b82f6;
            top: -100px;
            left: -100px;
            animation-duration: 18s;
        }

        .orb-2 {
            width: 700px;
            height: 700px;
            background: #8b5cf6;
            bottom: -200px;
            right: -100px;
            animation-duration: 24s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 500px;
            height: 500px;
            background: #ec4899;
            top: 40%;
            left: 30%;
            animation-duration: 22s;
            animation-delay: -10s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(120px, 80px) scale(1.15); }
            100% { transform: translate(-80px, 140px) scale(0.9); }
        }

        /* Glass Stage Card */
        .glass-stage {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(40px) saturate(190%);
            -webkit-backdrop-filter: blur(40px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-radius: 36px;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Vinyl Spin & Glow */
        .cover-art-box {
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-feature-settings: "tnum" on, "zero" on;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <!-- Atmospheric Liquid Aurora Background -->
    <div class="aurora-container">
        <div id="orb1" class="aurora-orb orb-1"></div>
        <div id="orb2" class="aurora-orb orb-2"></div>
        <div id="orb3" class="aurora-orb orb-3"></div>
    </div>

    <!-- Main Stage Center Piece -->
    <main class="w-full max-w-xl glass-stage p-6 sm:p-10 flex flex-col items-center text-center">
        
        <!-- Top Status Telemetry -->
        <div class="w-full flex items-center justify-between mb-8">
            <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/5 border border-white/10 text-[10px] mono font-bold uppercase tracking-widest text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="live-badge">LIVE PLAYBACK</span>
            </div>

            <a href="index.html" class="text-xs font-bold text-white/60 hover:text-white px-3 py-1.5 rounded-xl hover:bg-white/10 transition-colors">
                ← Portfolio
            </a>
        </div>

        <!-- Center Artwork -->
        <div class="relative w-48 h-48 sm:w-60 sm:h-60 rounded-3xl overflow-hidden mb-8 cover-art-box bg-slate-900 flex items-center justify-center">
            <img id="track-artwork" src="icon-192.png" alt="Artwork" class="w-full h-full object-cover">
        </div>

        <!-- Track Metadata -->
        <div class="w-full mb-8">
            <h1 id="track-title" class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight leading-tight mb-2 truncate">
                Wird geladen...
            </h1>
            <p id="track-artist" class="text-white/60 text-sm sm:text-base font-semibold truncate">
                Gamingpig Studio
            </p>
        </div>

        <!-- Clean Progress Bar & Timers -->
        <div class="w-full bg-slate-950/50 rounded-2xl p-4 border border-white/5 mb-6">
            <div class="flex justify-between text-xs mono font-bold mb-2">
                <span id="time-current" class="text-white">0:00</span>
                <span id="time-total" class="text-white/40">0:00</span>
            </div>
            <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden relative">
                <div id="progress-fill" class="h-full w-0 bg-white rounded-full transition-all duration-75"></div>
            </div>
        </div>

        <!-- Bottom Ambient Switcher -->
        <div class="w-full flex items-center justify-between text-[11px] mono text-white/40 pt-2 border-t border-white/10">
            <span>GAMINGPIG STUDIO ENGINE</span>
            <button onclick="cycleAurora()" class="text-white/70 hover:text-white font-bold transition-colors">
                🎨 Aura wechseln
            </button>
        </div>
    </main>

    <script>
        const API_URL = 'https://npc-api.aikins.xyz/v1/users/gamingpig/now';
        const FALLBACK_ART = 'https://gamingpig.github.io/About-Gamingpig/og-v2.jpg';

        const titleEl = document.getElementById('track-title');
        const artistEl = document.getElementById('track-artist');
        const artworkEl = document.getElementById('track-artwork');
        const fillEl = document.getElementById('progress-fill');
        const timeCurEl = document.getElementById('time-current');
        const timeTotEl = document.getElementById('time-total');
        const liveBadge = document.getElementById('live-badge');

        const orb1 = document.getElementById('orb1');
        const orb2 = document.getElementById('orb2');
        const orb3 = document.getElementById('orb3');

        let lastTrackKey = '';
        let serverBaseMs = 0;
        let localStart = performance.now();
        let totalDuration = 0;
        let isPlaying = false;
        let timeOffset = 0;
        const coverCache = new Map();

        async function syncWorldClock() {
            try {
                const t0 = performance.now();
                const res = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', { cache: 'no-store' });
                const data = await res.json();
                const latency = (performance.now() - t0) / 2;
                const serverTime = new Date(data.utc_datetime).getTime();
                timeOffset = (serverTime + latency) - Date.now();
            } catch(e) {}
        }
        syncWorldClock();
        setInterval(syncWorldClock, 600000);

        function formatTime(ms) {
            if (!ms || ms < 0) return '0:00';
            const s = Math.floor(ms / 1000);
            return `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
        }

        async function resolveCover(title, artist) {
            const key = `${title}-${artist}`.toLowerCase();
            if (coverCache.has(key)) return coverCache.get(key);

            try {
                const q = encodeURIComponent(`${artist} ${title}`);
                const r = await fetch(`https://api.deezer.com/search?q=${q}&limit=1`);
                const d = await r.json();
                const cover = d?.data?.[0]?.album?.cover_xl || d?.data?.[0]?.album?.cover_big;
                if (cover) { coverCache.set(key, cover); return cover; }
            } catch(e) {}

            try {
                const q = encodeURIComponent(`${artist} ${title}`);
                const r = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=1`);
                const d = await r.json();
                let art = d?.results?.[0]?.artworkUrl100;
                if (art) { art = art.replace('100x100bb', '600x600bb'); coverCache.set(key, art); return art; }
            } catch(e) {}

            return FALLBACK_ART;
        }

        async function pollTelemetry() {
            try {
                const res = await fetch(API_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error();
                const d = await res.json();

                const st = d.status;
                const tr = d.track || {};
                const title = tr.title || tr.name;
                const artist = tr.artist || '';
                const dur = tr.duration_ms || 0;
                let prog = tr.progress_ms || d.progress_ms || 0;

                if (st === 'playing' && title && title !== 'Aktuell ist es ruhig...') {
                    isPlaying = true;
                    totalDuration = dur;
                    timeTotEl.innerText = formatTime(dur);
                    liveBadge.innerText = 'LIVE PLAYBACK';

                    let serverTimestamp = d.timestamp || d.updated_at || (tr && tr.timestamp);
                    if (serverTimestamp) {
                        let stTime = typeof serverTimestamp === 'number'
                            ? (serverTimestamp < 20000000000 ? serverTimestamp * 1000 : serverTimestamp)
                            : new Date(serverTimestamp).getTime();
                        let rawAge = (Date.now() + timeOffset) - stTime;
                        if (rawAge >= 0 && rawAge <= (dur || 600000)) {
                            prog += rawAge;
                        }
                    }

                    const key = `${title}-${artist}`;
                    if (key !== lastTrackKey) {
                        lastTrackKey = key;
                        titleEl.innerText = title;
                        artistEl.innerText = artist;

                        serverBaseMs = prog;
                        localStart = performance.now();

                        resolveCover(title, artist).then(src => {
                            if (artworkEl.getAttribute('src') !== src) artworkEl.src = src;
                        });
                    } else {
                        const expected = serverBaseMs + (performance.now() - localStart);
                        const drift = prog - expected;
                        if (Math.abs(drift) > 2500) {
                            serverBaseMs = prog;
                            localStart = performance.now();
                        } else if (Math.abs(drift) > 150) {
                            serverBaseMs = expected + drift * 0.35;
                            localStart = performance.now();
                        }
                    }
                } else {
                    isPlaying = false;
                    liveBadge.innerText = 'STANDBY';
                    titleEl.innerText = 'Aktuell ist es ruhig...';
                    artistEl.innerText = 'Gamingpig genießt die Stille';
                    artworkEl.src = FALLBACK_ART;
                    fillEl.style.width = '0%';
                    timeCurEl.innerText = '0:00';
                    timeTotEl.innerText = '0:00';
                }
            } catch(e) {}
        }

        function renderProgress() {
            if (isPlaying && totalDuration > 0) {
                const currentMs = Math.min(totalDuration, serverBaseMs + (performance.now() - localStart));
                timeCurEl.innerText = formatTime(currentMs);
                const pct = Math.max(0, Math.min(100, (currentMs / totalDuration) * 100));
                fillEl.style.width = `${pct}%`;
            }
            requestAnimationFrame(renderProgress);
        }

        const auroraThemes = [
            ['#3b82f6', '#8b5cf6', '#ec4899'],
            ['#06b6d4', '#3b82f6', '#10b981'],
            ['#f43f5e', '#a855f7', '#fb923c']
        ];
        let auroraIdx = 0;

        window.cycleAurora = function() {
            auroraIdx = (auroraIdx + 1) % auroraThemes.length;
            const theme = auroraThemes[auroraIdx];
            orb1.style.backgroundColor = theme[0];
            orb2.style.backgroundColor = theme[1];
            orb3.style.backgroundColor = theme[2];
        };

        setInterval(pollTelemetry, 3000);
        pollTelemetry();
        requestAnimationFrame(renderProgress);
    </script>
</body>
</html>
