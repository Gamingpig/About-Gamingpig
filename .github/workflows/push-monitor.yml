name: 📡 Web Push & Health Monitoring

on:
  schedule:
    # Prüft alle 30 Minuten automatisch alle APIs
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run Health Check
        run: node scripts/push-monitor.js check
