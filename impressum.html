<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum / Legal Notice – Gamingpig Portfolio</title>
<link rel="icon" type="image/png" href="icon-192.png">
<script>
const IMP_I18N = {
  de: { readAloud: "Vorlesen", stop: "Stoppen", back: "← Hauptseite", speed: "Tempo" },
  en: { readAloud: "Read Aloud", stop: "Stop", back: "← Main Page", speed: "Speed" },
  es: { readAloud: "Leer en voz alta", stop: "Detener", back: "← Página Principal", speed: "Velocidad" },
  fr: { readAloud: "Lire à voix haute", stop: "Arrêter", back: "← Page Principale", speed: "Vitesse" },
  pt: { readAloud: "Ler em voz alta", stop: "Parar", back: "← Página Principal", speed: "Velocidade" },
  tr: { readAloud: "Sesli Oku", stop: "Durdur", back: "← Ana Sayfa", speed: "Hız" }
};

function updateImpressumUI(lang) {
  const code = (lang || (window.I18nManager ? window.I18nManager.getLanguage() : "de")).toLowerCase();
  
  document.querySelectorAll(".lang-block").forEach(b => {
    b.style.display = (b.getAttribute("data-lang") === code) ? "block" : "none";
  });
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-lang") === code);
  });
  document.documentElement.setAttribute("lang", code);

  const ttsStrings = IMP_I18N[code] || IMP_I18N.de;
  const backBtn = document.querySelector(".back-btn");
  if (backBtn) backBtn.textContent = ttsStrings.back;

  const label = document.getElementById("imp-tts-label");
  if (label && (!window.ReadAloudService || !window.ReadAloudService.isPlaying())) {
    label.textContent = ttsStrings.readAloud;
  }
}

function setImpressumLang(lang) {
  if (window.I18nManager) {
    window.I18nManager.setLanguage(lang);
  } else {
    try {
      localStorage.setItem("app_language", lang);
      localStorage.setItem("selectedLanguage", lang);
    } catch(e) {}
    updateImpressumUI(lang);
  }

  // If reading aloud, restart with new language
  if (window.ReadAloudService && window.ReadAloudService.isPlaying()) {
    toggleImpressumSpeech(true);
  }
}

window.addEventListener("app:languageChanged", (e) => {
  updateImpressumUI(e.detail.lang);
});

window.addEventListener("storage", (e) => {
  if (e.key === "app_language" || e.key === "selectedLanguage") {
    if (e.newValue) updateImpressumUI(e.newValue);
  }
});

function updateImpressumTtsSpeedUI() {
  const speed = window.ReadAloudService ? window.ReadAloudService.getSpeed() : (parseFloat(localStorage.getItem("gp_tts_speed")) || 1.0);
  const el = document.getElementById("imp-tts-speed-val");
  if (el) el.innerText = speed.toFixed(1) + "x";
  document.querySelectorAll(".tts-pill").forEach(btn => {
    btn.classList.toggle("active", Math.abs(parseFloat(btn.dataset.speed) - speed) < 0.05);
  });
}

function setImpressumTtsSpeed(rate) {
  if (window.ReadAloudService) {
    window.ReadAloudService.setSpeed(rate);
  } else {
    try { localStorage.setItem("gp_tts_speed", rate.toString()); } catch(e) {}
  }
  updateImpressumTtsSpeedUI();
  if (window.ReadAloudService && window.ReadAloudService.isPlaying()) {
    toggleImpressumSpeech(true);
  }
}

function toggleImpressumTtsMenu() {
  const menu = document.getElementById("imp-tts-menu");
  if (menu) menu.classList.toggle("hidden");
}

function stopImpressumSpeech() {
  if (window.ReadAloudService) {
    window.ReadAloudService.stop();
  }
  const btn = document.getElementById("imp-tts-btn");
  const label = document.getElementById("imp-tts-label");
  const lang = (window.I18nManager ? window.I18nManager.getLanguage() : "de");
  const strings = IMP_I18N[lang] || IMP_I18N.de;

  if (btn) btn.classList.remove("speaking");
  if (label) label.innerText = strings.readAloud;
  const menu = document.getElementById("imp-tts-menu");
  if (menu) menu.classList.add("hidden");
}

async function toggleImpressumSpeech(forceRestart) {
  if (!window.ReadAloudService) {
    alert("Sprachausgabe wird in diesem Browser leider nicht unterstützt.");
    return;
  }

  if (window.ReadAloudService.isPlaying() && !forceRestart) {
    stopImpressumSpeech();
    return;
  }

  const allBlocks = Array.from(document.querySelectorAll(".lang-block"));
  const activeBlock = allBlocks.find(b => b.style.display !== "none");
  if (!activeBlock) return;

  const currentLang = (window.I18nManager ? window.I18nManager.getLanguage() : activeBlock.getAttribute("data-lang")) || "de";
  const strings = IMP_I18N[currentLang] || IMP_I18N.de;

  const btn = document.getElementById("imp-tts-btn");
  const label = document.getElementById("imp-tts-label");

  await window.ReadAloudService.speak(activeBlock, currentLang, {
    onStart: () => {
      if (btn) btn.classList.add("speaking");
      if (label) label.innerText = strings.stop;
    },
    onEnd: () => {
      if (btn) btn.classList.remove("speaking");
      if (label) label.innerText = strings.readAloud;
    },
    onError: () => {
      if (btn) btn.classList.remove("speaking");
      if (label) label.innerText = strings.readAloud;
    }
  });
}

(function init() {
  const initialLang = window.I18nManager ? window.I18nManager.getLanguage() : "de";
  updateImpressumUI(initialLang);
  updateImpressumTtsSpeedUI();
})();
</script>
</body>
</html>
